apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  containers:
  - name: nginx
    image: nginx:1.14.2
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 80
    - containerPort: 443
    volumeMounts:
    - name: certs
      mountPath: /etc/nginx/certs
      readOnly: true
    - name: config
      mountPath: /etc/nginx/conf.d/default.conf
      subPath: default.conf
  volumes:
  - name: certs
    secret:
      secretName: nginx-tls
  - name: config
    configMap:
      name: nginx-config