apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django-ingress-final
  namespace: edu-edu-karaman-utegenov
  annotations:
    ingress.alb.yc.io/external-ipv4-address: auto
    ingress.alb.yc.io/subnets: e2lfaq3bc2ccbstre090
    ingress.alb.yc.io/group-name: django-group
spec:
  ingressClassName: yc-alb-ingress
  rules:
  - host: django-karaman.yc-sirius-dev.pelid.team
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: django-nodeport-svc
            port:
              number: 8000
